# Nginx configuration serving HTTP and HTTPS side by side, without redirect.
# - Browsers on the OASIS computer can keep using http://localhost.
# - CAMELS on lab computers needs HTTPS for remote control.
# Needs a certificate, see camels_broker/README.md.

include conf.d/nginx_maps_conf;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream nomad-app-backend {
    server app:8000;
    keepalive 64;
    keepalive_requests 1000;
    keepalive_timeout 60s;
}

server {
    listen        80;
    server_name   localhost;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    include conf.d/nginx_base_conf;
}

server {
    listen 443 ssl;
    server_name localhost;
    ssl_certificate     /etc/nginx/tls/mounted-nomad-oasis.crt;
    ssl_certificate_key /etc/nginx/tls/mounted-nomad-oasis.key;
    proxy_set_header Host $host;
    proxy_http_version 1.1;
    proxy_set_header   Connection "";
    include conf.d/nginx_base_conf;
}
