[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
]
name = "nomad-distribution"
description = "nomad distribution for LAP"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10, <3.13"
license = { file = "LICENSE" }
dependencies = ["nomad-lab[parsing, infrastructure]==1.4.3", "setuptools"]


[project.urls]
repository = "https://github.com/FAU-LAP/nomad-distro-LAP"

[project.optional-dependencies]
plugins = [
  "nomad-camels-plugin @ git+https://github.com/FAIRmat-NFDI/nomad-camels-plugin.git@v0.1.9",
  "nomad-lap-schema @ git+https://github.com/FAU-LAP/nomad-lap-schema@4d981dc2f3d8c3520bc5fbfaf05e2d546deffc04",
  "nomad-north-jupyter>=0.2.6",
]
jupyter = ["jupyter-events"]
gpu-action = []
cpu-action = []
dev = ["nomad-lab[parsing, infrastructure, dev]==1.4.3"]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
constraint-dependencies = ["hyperspy>=1.7.6"]
prerelease = "if-necessary-or-explicit"

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*"]
