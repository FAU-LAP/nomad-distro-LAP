[build-system]
requires = ["setuptools>=64", "setuptools-scm"]
build-backend = "setuptools.build_meta"

[tool.setuptools_scm]
fallback_version = "0.0"

[project]
classifiers = [
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]
name = "nomad-distribution"
description = "nomad distribution template"
dynamic = ["version"]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "nomad-lab[infrastructure]==1.4.3",
]

[project.urls]
repository = "https://github.com/FAIRmat-NFDI/nomad-distro-template"

[project.entry-points."nomad.plugin"]
nomad_camels_oasis = "nomad_camels_oasis.entry_points:camels"
nomad_camels_measurement_schema = "nomad_camels_oasis.entry_points:camels_measurement_schema"
nomad_camels_measurement_action = "nomad_camels_oasis.entry_points:camels_measurement_action"
nomad_camels_measurement_dashboard = "nomad_camels_oasis.entry_points:camels_measurement_dashboard"
nomad_camels_measurement_monitor_dashboard = "nomad_camels_oasis.entry_points:camels_measurement_monitor_dashboard"

[project.optional-dependencies]
# Add your plugins to the list below.
plugins = [
  "nomad-gui",
  "nomad-north-jupyter>=0.2.6",
]
jupyter = ["jupyter-events"]
gpu-action = []
cpu-action = []

dev = ["nomad-lab[infrastructure, dev]==1.4.3"]

[tool.uv]
extra-index-url = [
  "https://gitlab.mpcdf.mpg.de/api/v4/projects/2187/packages/pypi/simple",
]
prerelease = "if-necessary-or-explicit"

[tool.setuptools.packages.find]
exclude = ["gui*", "docs*", "config*", "camels_broker*"]
